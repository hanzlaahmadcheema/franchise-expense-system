<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta id="app-viewport" name="viewport" content="width=1280, initial-scale=1.0, minimum-scale=0.1, maximum-scale=5.0, user-scalable=yes" />
    <script>
      (function () {
        function setupResponsiveDesktopViewport() {
          var meta = document.getElementById('app-viewport');
          if (!meta) return;
          var targetWidth = 1280;
          var screenW = (window.screen && window.screen.width) ? window.screen.width : targetWidth;
          var winW = window.innerWidth || screenW;
          var minW = Math.min(screenW, winW);
          if (minW < targetWidth) {
            var scale = Math.max(0.1, Math.min(1, minW / targetWidth));
            meta.setAttribute(
              'content',
              'width=' + targetWidth + ', initial-scale=' + scale + ', minimum-scale=0.1, maximum-scale=5.0, user-scalable=yes'
            );
          } else {
            meta.setAttribute(
              'content',
              'width=device-width, initial-scale=1.0, minimum-scale=0.1, maximum-scale=5.0, user-scalable=yes'
            );
          }
        }
        setupResponsiveDesktopViewport();
        window.addEventListener('resize', setupResponsiveDesktopViewport);
        window.addEventListener('orientationchange', setupResponsiveDesktopViewport);
      })();
    </script>

    <title>Franchise Expense System</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
